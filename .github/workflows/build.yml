name: Build OverlayImage Tweak

env:
  ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      run: |
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
        xcode-select -p
        echo "Xcode version:"
        xcodebuild -version
    
    - name: Install Theos Dependencies
      run: |
        echo "Installing Theos dependencies..."
        brew install perl openssl gnupg2 2>/dev/null || true
        brew list | grep -E "perl|openssl|gnupg" || echo "Some packages may not be installed"
    
    - name: Install Theos
      run: |
        echo "Cloning Theos repository..."
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV
        export THEOS=~/theos
        echo "Theos directory contents:"
        ls -la $THEOS/
    
    - name: Configure Build Environment
      run: |
        export THEOS=~/theos
        echo "THEOS_DEVICE_IP=localhost" >> $GITHUB_ENV
        echo "THEOS_DEVICE_PORT=22" >> $GITHUB_ENV
        echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
        echo "ARCHS=arm64" >> $GITHUB_ENV
        echo "Build environment configured"
    
    - name: Verify Theos Installation
      run: |
        export THEOS=~/theos
        export PATH=$THEOS/bin:$PATH
        echo "THEOS: $THEOS"
        echo "PATH: $PATH"
        echo ""
        echo "Checking Theos bin directory:"
        ls -lah $THEOS/bin/ | head -20
        
        if [ -f "$THEOS/bin/nic.pl" ]; then
          echo "✓ nic.pl found"
        fi
    
    - name: List Project Structure
      run: |
        echo "Current directory: $(pwd)"
        echo "Project structure:"
        ls -la
        echo ""
        echo "OverlayImage directory:"
        ls -la OverlayImage/
    
    - name: Build OverlayImage
      run: |
        export THEOS=~/theos
        export PATH=$THEOS/bin:$PATH
        export ARCHS="arm64"
        
        cd OverlayImage
        echo "================================"
        echo "Starting OverlayImage build..."
        echo "================================"
        echo "THEOS: $THEOS"
        echo "Current directory: $(pwd)"
        
        echo ""
        echo "Step 1: Clean previous build..."
        make clean || true
        
        echo ""
        echo "Step 2: Build OverlayImage tweak..."
        make 2>&1 | tee build.log || {
          echo "ERROR: Make failed!"
          tail -50 build.log
          exit 1
        }
        
        echo ""
        echo "Step 3: Create packages directory..."
        mkdir -p packages
        
        echo ""
        echo "Step 4: Package .deb file..."
        make package FINALPACKAGE=1 2>&1 | tee package.log || {
          echo "ERROR: Package failed!"
          tail -50 package.log
          exit 1
        }
        
        echo ""
        echo "Step 5: Verify build artifacts..."
        if [ -f ".theos/obj/iphoneos-arm64/OverlayImage.deb" ]; then
          echo "✓ Found .deb in .theos/obj/iphoneos-arm64/"
          cp .theos/obj/iphoneos-arm64/OverlayImage.deb packages/OverlayImage_1.0_iphoneos-arm64.deb
          ls -lah packages/
        elif find . -name "*.deb" -type f 2>/dev/null | grep -q .; then
          echo "✓ Found .deb files:"
          find . -name "*.deb" -type f
          find . -name "*.deb" -type f -exec cp {} packages/ \;
        else
          echo "✗ No .deb file found!"
          echo "Directory structure:"
          find . -type d | head -20
          find . -name "*.o" -o -name "*.m" -type f | head -20
          exit 1
        fi
        
        echo ""
        echo "Build completed successfully!"
    
    - name: List Build Artifacts
      if: always()
      run: |
        echo "Checking for build artifacts..."
        if [ -d "OverlayImage/packages" ]; then
          echo "✓ Packages directory found:"
          ls -lah OverlayImage/packages/
        else
          echo "✗ Packages directory not found"
        fi
        
        echo ""
        echo "Searching for .deb files:"
        find OverlayImage -name "*.deb" 2>/dev/null || echo "No .deb files found"
        
        echo ""
        echo "Searching for .dylib files:"
        find OverlayImage -name "*.dylib" 2>/dev/null || echo "No .dylib files found"
    
    - name: Upload .deb Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: OverlayImage-deb
        path: OverlayImage/packages/*.deb
        retention-days: 30
    
    - name: Create Release on Tag
      if: startsWith(github.ref, 'refs/tags/v') && success()
      uses: softprops/action-gh-release@v1
      with:
        files: OverlayImage/packages/*.deb
        draft: false
        prerelease: false
    
    - name: Build Summary
      if: always()
      run: |
        echo "================================"
        echo "Build Summary"
        echo "================================"
        echo "Status: ${{ job.status }}"
        if [ -f "OverlayImage/build.log" ]; then
          echo ""
          echo "Tail of build.log (last 30 lines):"
          tail -30 OverlayImage/build.log || cat OverlayImage/build.log
        fi
